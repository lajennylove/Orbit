[package]
name = "orbit-orm"
version = "0.1.0"
edition = "2024"
description = "An ORM for Rocket.rs apps, starting with MySQL and MariaDB"
license = "MIT"
repository = "https://github.com/lajennylove/Orbit"
readme = "README.md"
keywords = ["orm", "mysql", "mariadb", "rocket"]
categories = ["database"]

[workspace]
members = [".", "orbit-macros"]

[features]
default = ["derive"]
derive = ["dep:orbit-macros"]
blocking = ["dep:tokio"]

[dependencies]
orbit-macros = { version = "0.1.0", path = "orbit-macros", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "tls-rustls", "chrono"] }
chrono = { version = "0.4.34", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time"], optional = true }

[dev-dependencies]
# Turns on `blocking` for the tests, so they run with `cargo test`. Consumers do not get it.
orbit-orm = { path = ".", features = ["blocking"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
